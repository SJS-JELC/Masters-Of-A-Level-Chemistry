<svg xmlns="http://www.w3.org/2000/svg" class="c-connectors" width="720" height="1030" viewBox="0 0 720 1030" role="img" aria-labelledby="network-title network-desc"><title id="network-title">Reaction network for compounds R to Z</title><desc id="network-desc">Reaction network of empty labelled compounds R–Z. Hydrolysis of R gives two S and one T per R; S is oxidised to T, then T is oxidised to U. Hydrolysis of W gives two U and one X per W. Hydrolysis of V gives two U per V. Hydrolysis of Y gives two X per Y. Hydrolysis of Z gives one X per Z, and dimerisation of Z gives Y.</desc><defs><marker id="c-arrow" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#ececff"/></marker></defs><style>.c-flow,.c-branch{fill:none;stroke:#ececff;stroke-width:1.7;stroke-linejoin:round}.c-flow{marker-end:url(#c-arrow)}.c-edge-label{font:700 12px Comfortaa,system-ui,sans-serif;fill:#f1f0ff;paint-order:stroke;stroke:#0a0d26;stroke-width:4px;stroke-linejoin:round}</style><path class="c-branch" d="M104 310 H180 M104 730 H180"/><path class="c-flow" data-edge="R-S" d="M180 310 V100 H318"/><path class="c-flow" data-edge="R-T" d="M180 310 H318"/><path class="c-flow" data-edge="S-T" d="M362 150 V182 H442 V285 H406"/><path class="c-flow" data-edge="T-U" d="M362 360 V392 H442 V495 H406"/><path class="c-flow" data-edge="W-U" d="M180 730 V520 H318"/><path class="c-flow" data-edge="W-X" d="M180 730 H318"/><path class="c-flow" data-edge="V-U" d="M610 520 H406"/><path class="c-flow" data-edge="Y-X" d="M610 730 H406"/><path class="c-flow" data-edge="Z-X" d="M470 960 H362 V780"/><path class="c-flow" data-edge="Z-Y" d="M558 960 H654 V780"/><text class="c-edge-label" x="146" y="338" text-anchor="middle"><tspan x="146" dy="0">Hydrolysis</tspan></text><text class="c-edge-label" x="146" y="758" text-anchor="middle"><tspan x="146" dy="0">Hydrolysis</tspan></text><text class="c-edge-label" x="249" y="70" text-anchor="middle" data-label-for="R-S"><tspan x="249" dy="0">two per</tspan><tspan x="249" dy="16">molecule of R</tspan></text><text class="c-edge-label" x="249" y="280" text-anchor="middle" data-label-for="R-T"><tspan x="249" dy="0">one per</tspan><tspan x="249" dy="16">molecule of R</tspan></text><text class="c-edge-label" x="249" y="490" text-anchor="middle" data-label-for="W-U"><tspan x="249" dy="0">two per</tspan><tspan x="249" dy="16">molecule of W</tspan></text><text class="c-edge-label" x="249" y="700" text-anchor="middle" data-label-for="W-X"><tspan x="249" dy="0">one per</tspan><tspan x="249" dy="16">molecule of W</tspan></text><text class="c-edge-label" x="454" y="217" text-anchor="start" data-label-for="S-T"><tspan x="454" dy="0">Oxidation</tspan></text><text class="c-edge-label" x="454" y="427" text-anchor="start" data-label-for="T-U"><tspan x="454" dy="0">Oxidation</tspan></text><text class="c-edge-label" x="518" y="506" text-anchor="middle" data-label-for="V-U"><tspan x="518" dy="0">Hydrolysis</tspan></text><text class="c-edge-label" x="518" y="545" text-anchor="middle" data-label-for="V-U"><tspan x="518" dy="0">two per molecule of V</tspan></text><text class="c-edge-label" x="518" y="716" text-anchor="middle" data-label-for="Y-X"><tspan x="518" dy="0">Hydrolysis</tspan></text><text class="c-edge-label" x="518" y="755" text-anchor="middle" data-label-for="Y-X"><tspan x="518" dy="0">two per molecule of Y</tspan></text><text class="c-edge-label" x="412" y="941" text-anchor="middle" data-label-for="Z-X"><tspan x="412" dy="0">Hydrolysis</tspan></text><text class="c-edge-label" x="350" y="830" text-anchor="end" data-label-for="Z-X"><tspan x="350" dy="0">one per</tspan><tspan x="350" dy="16">molecule of Z</tspan></text><text class="c-edge-label" x="606" y="940" text-anchor="middle" data-label-for="Z-Y"><tspan x="606" dy="0">Dimerization</tspan></text><g><rect x="16" y="260" width="88" height="100" rx="12" fill="#0a0d26" stroke="#7780a6"/><text x="24" y="278" fill="#55f6ff" font-family="Comfortaa, sans-serif" font-size="12">R</text></g><g><rect x="318" y="50" width="88" height="100" rx="12" fill="#0a0d26" stroke="#7780a6"/><text x="326" y="68" fill="#55f6ff" font-family="Comfortaa, sans-serif" font-size="12">S</text></g><g><rect x="318" y="260" width="88" height="100" rx="12" fill="#0a0d26" stroke="#7780a6"/><text x="326" y="278" fill="#55f6ff" font-family="Comfortaa, sans-serif" font-size="12">T</text></g><g><rect x="318" y="470" width="88" height="100" rx="12" fill="#0a0d26" stroke="#7780a6"/><text x="326" y="488" fill="#55f6ff" font-family="Comfortaa, sans-serif" font-size="12">U</text></g><g><rect x="610" y="470" width="88" height="100" rx="12" fill="#0a0d26" stroke="#7780a6"/><text x="618" y="488" fill="#55f6ff" font-family="Comfortaa, sans-serif" font-size="12">V</text></g><g><rect x="16" y="680" width="88" height="100" rx="12" fill="#0a0d26" stroke="#7780a6"/><text x="24" y="698" fill="#55f6ff" font-family="Comfortaa, sans-serif" font-size="12">W</text></g><g><rect x="318" y="680" width="88" height="100" rx="12" fill="#0a0d26" stroke="#7780a6"/><text x="326" y="698" fill="#55f6ff" font-family="Comfortaa, sans-serif" font-size="12">X</text></g><g><rect x="610" y="680" width="88" height="100" rx="12" fill="#0a0d26" stroke="#7780a6"/><text x="618" y="698" fill="#55f6ff" font-family="Comfortaa, sans-serif" font-size="12">Y</text></g><g><rect x="470" y="910" width="88" height="100" rx="12" fill="#0a0d26" stroke="#7780a6"/><text x="478" y="928" fill="#55f6ff" font-family="Comfortaa, sans-serif" font-size="12">Z</text></g></svg>