<!doctype html>
<html lang="en-GB">
<head>

<body>
  <div class="stars" aria-hidden="true"></div>
  <a class="skip-link" href="#course">Skip to course topics</a>
  <main class="ocr-shell">
    <header class="ocr-brand">
      <img src="assets/SJS-Eagle.svg" alt="St John's School eagle" width="44" height="52">
      <div><p class="eyebrow">SJS / CHEMISTRY A · H432</p><h1>Masters of <span>A Level Chemistry</span></h1></div>
      <button id="flipYear" class="subject-toggle" type="button" role="switch" aria-checked="false" aria-label="Upper Sixth" aria-controls="t1-card t2-card"><span class="physical-label">Lower Sixth</span><span class="toggle-track" aria-hidden="true"><span class="toggle-sun">&#9728;</span><span class="toggle-moon">&#9790;</span><span class="toggle-thumb"></span></span><span class="organic-label">Upper Sixth</span></button>

      <noscript><p>Enable JavaScript to explore the course.</p></noscript>

    <dialog id="gemDetails" aria-labelledby="detailName" aria-describedby="detailPath activityNote">
      <form method="dialog"><button class="close-details" aria-label="Close gem details" autofocus>×</button></form>

      <h2 id="detailName"></h2>
      <div id="detailStats"></div>
      <p class="activity-status" id="activityStatus"></p>
      <p id="activityNote"></p>
      <a class="activity-link" id="activityLink" hidden></a>
    </dialog>
    <p class="closing-line">Legends aren't born, they're forged</p>
  </main>
  <script src="assets/site-version.js"></script>
  <script defer src="assets/test-mode-core.js"></script>
  <script defer src="assets/test-mode.js"></script>
